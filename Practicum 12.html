<!DOCTYPE html>
<html>
<head>
  <title>IoT Data Management</title>
<style>
  body {
    font-family: Arial, sans-serif;
    background: #fdf6f0;
    text-align: center;
    padding: 20px;
  }

  .zone {
    border: 2px solid #9d4edd;
    background: #f3e8ff;
    padding: 15px;
    margin: 10px auto;
    width: 500px;
    border-radius: 8px;
  }

  .row {
    display: flex;
    justify-content: space-around;
    margin-top: 12px;
  }

  .node {
    background: white;
    padding: 10px 14px;
    border: 2px solid #7b2cbf;
    border-radius: 6px;
    color: #5a189a;
    font-weight: bold;
  }
</style>
</head>
<body>
  <div class="zone">
    <strong>1. SMART HOME SENSORS (CLIENT LAYER)</strong>
    <div class="row"><div class="node">🌡️ Thermostat</div><div class="node">📷 Smart Camera</div></div>
  </div>
  <div>⬇ (1) Sensor Telemetry Stream ⬇</div>
  <div class="zone">
    <strong>2. IOT CLOUD PROCESSING ENGINE</strong>
    <div class="row">
      <div class="node">(2) MQTT Gateway</div>
      <div class="node">(3) Stream Processor</div>
      <div class="node">(4) Alert Engine</div>
    </div>
    <div class="row">
      <div class="node">Time-Series DB</div>
      <div class="node">Analytics Dashboard</div>
      <div class="node">Auth Token Vault</div>
    </div>
  </div>
</body>
</html>
